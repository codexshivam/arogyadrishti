[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nidaniq-nepal-sovereign-dpi"
version = "2.0.0"
description = "Sovereign Vector Surveillance & Early Warning DPI Backend for the Government of Nepal (MoHP / EDCD Teku / 753 Palikas)"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Government of Nepal — MoHP / EDCD Vector Surveillance Architecture Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "nepali-datetime>=1.0.8",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "earthengine-api>=1.0.0",
    "slowapi>=0.1.9",
    "openpyxl>=3.1.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "B008", "B904"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
