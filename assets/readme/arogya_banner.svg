<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean Bold Crimson / Red Background -->
  <rect width="1200" height="240" rx="16" fill="url(#redGrad)" />

  <!-- Subtle Vector Grid Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="1200" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="1000" y1="0" x2="1000" y2="240" />
  </g>

  <!-- Main Arogya Typography -->
  <!-- White Text "Arogya" -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="132" font-size="78" font-weight="900" fill="#FFFFFF" letter-spacing="4" filter="url(#shadow)">AROGYA</text>
    <text x="600" y="172" font-size="16" font-weight="600" fill="#FEE2E2" letter-spacing="8" opacity="0.95">आरोग्य दृष्टि • NATIONAL VECTOR SURVEILLANCE DPI</text>
  </g>
</svg>
