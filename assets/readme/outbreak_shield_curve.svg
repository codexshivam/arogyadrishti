<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%" style="background:#090D17; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="curveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E0A10" />
    </linearGradient>

    <!-- Curve Fill Gradients -->
    <linearGradient id="unmitigatedFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="mitigatedFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .curve-unmitigated {
        stroke-dasharray: 850;
        stroke-dashoffset: 850;
        animation: drawLine 3.5s ease-out forwards infinite;
      }
      .curve-mitigated {
        stroke-dasharray: 850;
        stroke-dashoffset: 850;
        animation: drawLine 3.5s ease-out forwards infinite;
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 850; }
        65%, 100% { stroke-dashoffset: 0; }
      }

      .pulse-marker {
        animation: calloutPulse 1.8s infinite;
      }
      @keyframes calloutPulse {
        0% { r: 5; opacity: 1; }
        50% { r: 16; opacity: 0.3; }
        100% { r: 24; opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1000" height="260" fill="url(#curveBg)" />

  <!-- Graph Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="2,4" opacity="0.6">
    <!-- Horizontal baseline -->
    <line x1="80" y1="210" x2="940" y2="210" stroke="#475569" stroke-width="1.2" stroke-dasharray="none" />
    <line x1="80" y1="160" x2="940" y2="160" />
    <line x1="80" y1="110" x2="940" y2="110" />
    <line x1="80" y1="60" x2="940" y2="60" />

    <!-- Vertical Timeline Dividers -->
    <line x1="160" y1="40" x2="160" y2="210" />
    <line x1="320" y1="40" x2="320" y2="210" stroke="#10B981" stroke-width="1.2" opacity="0.8" />
    <line x1="560" y1="40" x2="560" y2="210" stroke="#EF4444" stroke-width="1.2" opacity="0.8" />
    <line x1="760" y1="40" x2="760" y2="210" />
  </g>

  <!-- Y-Axis Labels -->
  <text x="70" y="214" font-size="8" font-weight="600" fill="#64748B" text-anchor="end">0</text>
  <text x="70" y="164" font-size="8" font-weight="600" fill="#64748B" text-anchor="end">250</text>
  <text x="70" y="114" font-size="8" font-weight="600" fill="#64748B" text-anchor="end">500</text>
  <text x="70" y="64" font-size="8" font-weight="600" fill="#64748B" text-anchor="end">750+</text>
  <text x="35" y="130" font-size="8" font-weight="700" fill="#94A3B8" transform="rotate(-90 35 130)" text-anchor="middle" letter-spacing="1">HOSPITAL ADMISSIONS / WK</text>

  <!-- X-Axis Timeline Labels -->
  <text x="160" y="228" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">DAY -14</text>
  <text x="160" y="240" font-size="7.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Satellite LST/NDWI Warning</text>

  <text x="320" y="228" font-size="9" font-weight="800" fill="#10B981" text-anchor="middle">DAY -10</text>
  <text x="320" y="240" font-size="7.5" font-weight="600" fill="#6EE7B7" text-anchor="middle">Arogya Drishti Interception</text>

  <text x="560" y="228" font-size="9" font-weight="800" fill="#EF4444" text-anchor="middle">DAY 0</text>
  <text x="560" y="240" font-size="7.5" font-weight="500" fill="#FCA5A5" text-anchor="middle">Unmitigated Admissions Spike</text>

  <text x="760" y="228" font-size="9" font-weight="700" fill="#A855F7" text-anchor="middle">DAY +14</text>
  <text x="760" y="240" font-size="7.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Epidemic Decline</text>

  <!-- Filled Area Under Unmitigated Curve -->
  <path d="M 120,210 C 260,208 420,180 500,100 C 560,40 600,45 660,110 C 740,185 840,205 920,210 Z" fill="url(#unmitigatedFill)" />

  <!-- Filled Area Under Arogya Drishti Mitigated Curve -->
  <path d="M 120,210 C 240,208 300,195 340,180 C 440,145 520,152 620,165 C 720,180 820,202 920,210 Z" fill="url(#mitigatedFill)" />

  <!-- Unmitigated Hospital Outbreak Curve Line (Crimson) -->
  <path d="M 120,210 C 260,208 420,180 500,100 C 560,40 600,45 660,110 C 740,185 840,205 920,210 Z" fill="none" stroke="#EF4444" stroke-width="2.8" class="curve-unmitigated" filter="url(#glowRed)" />

  <!-- Mitigated Proactive Curve Line (Emerald) -->
  <path d="M 120,210 C 240,208 300,195 340,180 C 440,145 520,152 620,165 C 720,180 820,202 920,210 Z" fill="none" stroke="#10B981" stroke-width="3" class="curve-mitigated" filter="url(#glowGreen)" />

  <!-- Day -10 Pulsing Callout (The Moment of Proactive Neutralization) -->
  <g transform="translate(320, 185)">
    <circle cx="0" cy="0" class="pulse-marker" fill="none" stroke="#10B981" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#10B981" />
    <line x1="0" y1="0" x2="35" y2="-45" stroke="#10B981" stroke-width="1.2" />
    <g transform="translate(35, -70)">
      <rect x="0" y="0" width="180" height="26" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="8" y="12" font-size="7.5" font-weight="800" fill="#A7F3D0">DAY -10: LARVAL VECTOR NEUTRALIZED</text>
      <text x="8" y="21" font-size="7" font-weight="600" fill="#6EE7B7">Van Dispatched • Temephos Dose Prescribed</text>
    </g>
  </g>

  <!-- 68% Reduction Callout Badge (Center Spike) -->
  <g transform="translate(560, 48)">
    <circle cx="0" cy="0" r="5" fill="#EF4444" />
    <g transform="translate(15, -15)">
      <rect x="0" y="0" width="170" height="32" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2" />
      <text x="8" y="14" font-size="8.5" font-weight="800" fill="#C7D2FE">▼ 68% HOSPITAL SURGE AVOIDED</text>
      <text x="8" y="25" font-size="7" font-weight="500" fill="#A5B4FC">Prevented Adult Mosquito Emergence</text>
    </g>
  </g>

  <!-- Legend (Top Right) -->
  <g transform="translate(680, 20)">
    <rect x="0" y="0" width="290" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" opacity="0.95" />
    <!-- Item 1 -->
    <line x1="15" y1="15" x2="40" y2="15" stroke="#EF4444" stroke-width="2.5" />
    <text x="48" y="18" font-size="8" font-weight="600" fill="#FCA5A5">Reactive Hospital Surveillance (Unmitigated)</text>
    <!-- Item 2 -->
    <line x1="15" y1="30" x2="40" y2="30" stroke="#10B981" stroke-width="2.5" />
    <text x="48" y="33" font-size="8" font-weight="700" fill="#6EE7B7">Arogya Drishti Proactive Interception (-14d)</text>
  </g>
</svg>
