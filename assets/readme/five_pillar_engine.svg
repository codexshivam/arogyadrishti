<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%" style="background:#0B0F19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="streamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1B0E1E" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for Input Nodes -->
    <linearGradient id="nodeGee" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="nodeGemma" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="nodeFirestore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="nodeOgd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="nodeNews" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <!-- Core Radial Gradient -->
    <radialGradient id="coreRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="45%" stop-color="#991B1B" />
      <stop offset="85%" stop-color="#450A0A" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Paths for SMIL animateMotion -->
    <!-- Pillar 1 -> Core -->
    <path id="path1" d="M 235,38 C 360,38 420,130 500,135" fill="none" />
    <!-- Pillar 2 -> Core -->
    <path id="path2" d="M 235,86 C 350,86 420,132 500,138" fill="none" />
    <!-- Pillar 3 -> Core -->
    <path id="path3" d="M 235,140 L 500,140" fill="none" />
    <!-- Pillar 4 -> Core -->
    <path id="path4" d="M 235,194 C 350,194 420,148 500,142" fill="none" />
    <!-- Pillar 5 -> Core -->
    <path id="path5" d="M 235,242 C 360,242 420,150 500,145" fill="none" />

    <!-- Core -> Output 1 (Google Sheets) -->
    <path id="outPath1" d="M 600,135 C 680,130 740,55 830,55" fill="none" />
    <!-- Core -> Output 2 (Google Maps Routes v2) -->
    <path id="outPath2" d="M 600,140 L 830,140" fill="none" />
    <!-- Core -> Output 3 (06:05 AM IST HTML Briefing) -->
    <path id="outPath3" d="M 600,145 C 680,150 740,225 830,225" fill="none" />

    <style>
      .dash-line {
        stroke-dasharray: 4,4;
        animation: dashFlow 1.8s linear infinite;
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 16; }
        to { stroke-dashoffset: 0; }
      }
      .spin-ring {
        animation: ringSpin 8s linear infinite;
        transform-origin: 550px 140px;
      }
      @keyframes ringSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <rect width="1100" height="280" fill="url(#streamBg)" />

  <!-- Flow Track Lines (Connecting Ingestion to Core) -->
  <g stroke="#334155" stroke-width="1.2" opacity="0.45">
    <path d="M 235,38 C 360,38 420,130 500,135" fill="none" />
    <path d="M 235,86 C 350,86 420,132 500,138" fill="none" />
    <path d="M 235,140 L 500,140" fill="none" />
    <path d="M 235,194 C 350,194 420,148 500,142" fill="none" />
    <path d="M 235,242 C 360,242 420,150 500,145" fill="none" />
  </g>

  <!-- Flow Track Lines (Connecting Core to Output Actions) -->
  <g stroke="#334155" stroke-width="1.2" opacity="0.45">
    <path d="M 600,135 C 680,130 740,55 830,55" fill="none" />
    <path d="M 600,140 L 830,140" fill="none" />
    <path d="M 600,145 C 680,150 740,225 830,225" fill="none" />
  </g>

  <!-- Glowing Animated Particles on Ingestion Streams -->
  <!-- Stream 1: GEE Satellite (Cyan) -->
  <circle r="4" fill="#38BDF8" filter="url(#particleGlow)">
    <animateMotion dur="2.4s" repeatCount="indefinite">
      <mpath href="#path1" />
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#E0F2FE">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite">
      <mpath href="#path1" />
    </animateMotion>
  </circle>

  <!-- Stream 2: Open-Weight AI (Purple) -->
  <circle r="4" fill="#A855F7" filter="url(#particleGlow)">
    <animateMotion dur="2.0s" repeatCount="indefinite">
      <mpath href="#path2" />
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#F3E8FF">
    <animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite">
      <mpath href="#path2" />
    </animateMotion>
  </circle>

  <!-- Stream 3: Field Entomology Logs (Orange) -->
  <circle r="4" fill="#F97316" filter="url(#particleGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite">
      <mpath href="#path3" />
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#FFEDD5">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite">
      <mpath href="#path3" />
    </animateMotion>
  </circle>

  <!-- Stream 4: OGD data.gov.in (Emerald) -->
  <circle r="4" fill="#10B981" filter="url(#particleGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath href="#path4" />
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#D1FAE5">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite">
      <mpath href="#path4" />
    </animateMotion>
  </circle>

  <!-- Stream 5: Google News NLP (Rose) -->
  <circle r="4" fill="#F43F5E" filter="url(#particleGlow)">
    <animateMotion dur="2.5s" repeatCount="indefinite">
      <mpath href="#path5" />
    </animateMotion>
  </circle>
  <circle r="2.5" fill="#FFE4E6">
    <animateMotion dur="2.5s" begin="1.25s" repeatCount="indefinite">
      <mpath href="#path5" />
    </animateMotion>
  </circle>

  <!-- Glowing Animated Particles on Outflow Actions -->
  <!-- Outflow 1: Sheets (Emerald) -->
  <circle r="4" fill="#34D399" filter="url(#particleGlow)">
    <animateMotion dur="2.0s" repeatCount="indefinite">
      <mpath href="#outPath1" />
    </animateMotion>
  </circle>

  <!-- Outflow 2: Maps Routes (Amber) -->
  <circle r="4" fill="#FBBF24" filter="url(#particleGlow)">
    <animateMotion dur="1.7s" repeatCount="indefinite">
      <mpath href="#outPath2" />
    </animateMotion>
  </circle>

  <!-- Outflow 3: Digest Alerts (Rose) -->
  <circle r="4" fill="#F87171" filter="url(#particleGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath href="#outPath3" />
    </animateMotion>
  </circle>

  <!-- ================================================================= -->
  <!-- 5 INGESTION SOURCE PILLARS (LEFT COLUMN)                          -->
  <!-- ================================================================= -->
  <!-- Pillar 1: Google Earth Engine -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#111827" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="18" cy="18" r="6" fill="#0284C7" />
    <text x="32" y="15" font-size="9.5" font-weight="700" fill="#F8FAFC">GOOGLE EARTH ENGINE (GEE)</text>
    <text x="32" y="27" font-size="7.5" font-weight="500" fill="#38BDF8">MODIS LST • Sentinel-2 NDWI • S1 SAR</text>
  </g>

  <!-- Pillar 2: Open-Weight AI (Gemma 4 & PaliGemma) -->
  <g transform="translate(25, 68)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.2" />
    <circle cx="18" cy="18" r="6" fill="#8B5CF6" />
    <text x="32" y="15" font-size="9.5" font-weight="700" fill="#F8FAFC">OPEN-WEIGHT MULTIMODAL AI</text>
    <text x="32" y="27" font-size="7.5" font-weight="500" fill="#C4B5FD">Gemma 4 26B/4B • PaliGemma Vision</text>
  </g>

  <!-- Pillar 3: Offline-First Firestore Logs -->
  <g transform="translate(25, 122)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#111827" stroke="#EA580C" stroke-width="1.2" />
    <circle cx="18" cy="18" r="6" fill="#EA580C" />
    <text x="32" y="15" font-size="9.5" font-weight="700" fill="#F8FAFC">FIRESTORE FIELD LOGS</text>
    <text x="32" y="27" font-size="7.5" font-weight="500" fill="#FDBA74">ASHA House (HI) &amp; Container (CI) Tallies</text>
  </g>

  <!-- Pillar 4: Open Government Data (data.gov.in) -->
  <g transform="translate(25, 176)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#111827" stroke="#059669" stroke-width="1.2" />
    <circle cx="18" cy="18" r="6" fill="#059669" />
    <text x="32" y="15" font-size="9.5" font-weight="700" fill="#F8FAFC">OPEN GOVT DATA (OGD INDIA)</text>
    <text x="32" y="27" font-size="7.5" font-weight="500" fill="#6EE7B7">api.data.gov.in • 10-Digit LGD Codes</text>
  </g>

  <!-- Pillar 5: Google News NLP Stream -->
  <g transform="translate(25, 224)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#111827" stroke="#DB2777" stroke-width="1.2" />
    <circle cx="18" cy="18" r="6" fill="#DB2777" />
    <text x="32" y="15" font-size="9.5" font-weight="700" fill="#F8FAFC">MUNICIPAL NEWS SIGNAL MINING</text>
    <text x="32" y="27" font-size="7.5" font-weight="500" fill="#F472B6">Waterlogging, Drain &amp; Fever Reports</text>
  </g>

  <!-- ================================================================= -->
  <!-- CENTRAL EPIDEMIOLOGICAL MATH & RISK FUSION CORE                   -->
  <!-- ================================================================= -->
  <g transform="translate(550, 140)">
    <!-- Outer Orbiting Dashed Ring -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6,4" class="spin-ring" opacity="0.75" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Core Body -->
    <circle cx="0" cy="0" r="48" fill="url(#coreRadial)" stroke="#EF4444" stroke-width="2" filter="url(#coreGlow)" />

    <!-- Pulse Animation -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="46; 62; 46" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 0.05; 0.6" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Core Text -->
    <text x="0" y="-12" text-anchor="middle" font-size="7.5" font-weight="800" fill="#FCA5A5" letter-spacing="1">06:00 AM IST</text>
    <text x="0" y="2" text-anchor="middle" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">FUSION CORE</text>
    <text x="0" y="15" text-anchor="middle" font-size="7.5" font-weight="700" fill="#FEF08A">COMPOSITE RISK</text>
    <text x="0" y="26" text-anchor="middle" font-size="8" font-weight="800" fill="#10B981">(0 – 100)</text>
  </g>

  <!-- ================================================================= -->
  <!-- 3 AUTOMATED OUTPUT CHANNELS (RIGHT COLUMN)                        -->
  <!-- ================================================================= -->
  <!-- Output 1: Google Sheets Municipal Ledger -->
  <g transform="translate(830, 36)">
    <rect x="0" y="0" width="245" height="38" rx="6" fill="#111827" stroke="#10B981" stroke-width="1.2" />
    <circle cx="18" cy="19" r="6" fill="#10B981" />
    <text x="32" y="16" font-size="9.5" font-weight="700" fill="#F8FAFC">7-TAB GOOGLE SHEETS LEDGER</text>
    <text x="32" y="28" font-size="7.5" font-weight="500" fill="#6EE7B7">1:1 Ward Roster • Fleet &amp; Bed Capacity</text>
  </g>

  <!-- Output 2: Google Maps Routes v2 Fleet Dispatch -->
  <g transform="translate(830, 121)">
    <rect x="0" y="0" width="245" height="38" rx="6" fill="#111827" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="18" cy="19" r="6" fill="#F59E0B" />
    <text x="32" y="16" font-size="9.5" font-weight="700" fill="#F8FAFC">GOOGLE MAPS ROUTES v2 DISPATCH</text>
    <text x="32" y="28" font-size="7.5" font-weight="500" fill="#FCD34D">Live Traffic ETA • Automated Van Allocation</text>
  </g>

  <!-- Output 3: 06:05 AM IST Executive Briefing -->
  <g transform="translate(830, 206)">
    <rect x="0" y="0" width="245" height="38" rx="6" fill="#111827" stroke="#EF4444" stroke-width="1.2" />
    <circle cx="18" cy="19" r="6" fill="#EF4444" />
    <text x="32" y="16" font-size="9.5" font-weight="700" fill="#F8FAFC">06:05 AM IST WARD BRIEFINGS</text>
    <text x="32" y="28" font-size="7.5" font-weight="500" fill="#FCA5A5">Automated HTML Digests to Allocated SIs</text>
  </g>
</svg>
