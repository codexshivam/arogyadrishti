# Arogya Drishti — Cloud Build CI/CD Pipeline (Pinned to asia-south1 Mumbai)
options:
  logging: CLOUD_LOGGING_ONLY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: arogya-drishti-api
  _REPO_NAME: arogya-drishti-repo

steps:
  # 1. Lint & Unit Test Backend + Agent Skill Harness
  - name: 'python:3.12-slim'
    id: 'test-backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r backend/requirements.txt
        ruff check backend skills
        pytest backend/tests/test_backend_and_tools.py -k "not live"

  # 2. Build Container Image for Cloud Run (asia-south1)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-container'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # 3. Push Image to Artifact Registry in asia-south1
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-container'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA'

  # 4. Deploy to Cloud Run in asia-south1 with Secret Manager bindings
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION}'
      - '--quiet'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA'
