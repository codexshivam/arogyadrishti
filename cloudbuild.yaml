# NidanIQ — Sovereign Container Build Pipeline (Government of Nepal / MoHP EDCD)
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE_NAME: nidaniq-nepal-api
  _REPO_NAME: nidaniq-nepal-repo
  _TAG: latest

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-sovereign-container'
    args:
      - 'build'
      - '-t'
      - '${_SERVICE_NAME}:${_TAG}'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'
